<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Happy Birthday Safwan 🎂</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb);
    font-family: 'Comic Sans MS', cursive, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Main box */
.birthday-box {
    text-align: center;
    padding: 40px;
    background: rgba(255,255,255,0.15);
    border-radius: 20px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 30px rgba(0,0,0,0.2);
}

/* Text style */
.say {
    font-size: 30px;
    font-weight: bold;
    color: #ffffff;
    line-height: 55px;
    letter-spacing: 1px;
    opacity: 0;
    transform: translateY(30px);
    animation: fadeUp 1s ease forwards;
    text-shadow: 0 0 15px rgba(0,0,0,0.4);
}

/* Line delays */
.say:nth-child(1) { animation-delay: 0.5s; }
.say:nth-child(2) { animation-delay: 1.5s; }
.say:nth-child(3) { animation-delay: 2.5s; }
.say:nth-child(4) { animation-delay: 3.5s; }
.say:nth-child(5) { animation-delay: 4.5s; }
.say:nth-child(6) { animation-delay: 5.5s; }

/* Highlight Birthday */
.say:nth-child(2) {
    font-size: 45px;
    color: #FFD700;
    text-shadow: 0 0 20px #FFD700;
}

/* Animation */
@keyframes fadeUp {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>

</head>
<body>

<div class="birthday-box">
    <div class="say">Hey Safwan 💞</div>
    <div class="say">Happy 4th Birthday 🎈</div>
    <div class="say">May Allah bless you always 🤲</div>
    <div class="say">May your life be full of toys and happiness 🚗🎁</div>
    <div class="say">Lots of love from your Fufi ❤️</div>
    <div class="say">Have the most amazing day ever 🎂✨</div>
</div>

</body>
</html>
